# Netlify deploy config for the weekly-fixture site.
#
# This is a static site — no build step. The folder `weekly-fixture/` is
# served as the site root, so `index.html` at Netlify root = `weekly-fixture/index.html`.

[build]
  publish = "weekly-fixture"
  # No command needed; everything is already built / committed in git.
  # `subscribe-data.json` is generated by `npm run generate-docs` and committed
  # by the scheduled GitHub Action.

  # Deploys are triggered exclusively by the "Deploy Weekly Fixture Site"
  # GitHub Actions workflow (.github/workflows/deploy-weekly-fixture.yml),
  # which calls a Netlify build hook only when a push actually touches
  # weekly-fixture/ code (not weekly-fixture/data/, which refreshes nightly
  # via jsDelivr with no rebuild needed). A path-based `ignore` heuristic
  # here proved unreliable at catching that distinction and was burning
  # build minutes on every nightly data-only commit — GitHub's own push
  # `paths` filter doesn't have that failure mode, since it's evaluated
  # before a workflow run is even queued. Unconditionally skip git-triggered
  # builds so a plain `git push` never deploys in parallel with the hook.
  ignore = "exit 0"

# ─── Caching headers ───────────────────────────────────────────────
# Data files change weekly — let browsers revalidate quickly.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# HTML: short cache so tab/content changes ship quickly.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Logos + OG image rarely change.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Icons / favicon pack.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# CSS/JS — hash-less filenames, so keep caching modest until we add fingerprinting.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Service worker must be revalidated every navigation so users pick up new
# versions on next visit. Browsers also refuse SWs served with a long max-age.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
